<!DOCTYPE html>
<html>
<head>
  <title>Product Table Comparison - Part 1</title>
  <style>
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      max-width: 900px; 
      margin: 0 auto; 
      padding: 30px; 
      background: linear-gradient(135deg, #9e0af9 0%, #fe05f6 100%);
      min-height: 100vh;
    }
    
    .container { 
      background: rgb(233, 115, 231); 
      border-radius: 20px; 
      padding: 40px; 
      box-shadow: 0 25px 50px rgb(2, 203, 248); 
    }
    
    h1 { 
      text-align: center; 
      color: #1b10f1; 
      margin-bottom: 10px;
      font-size: 2.2em;
    }
    
    .subtitle { 
      text-align: center; 
      color: #666; 
      margin-bottom: 40px;
      font-size: 1.1em;
    }
    
    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    
    button { 
      padding: 15px 25px; 
      font-size: 1.1em; 
      font-weight: 600;
      border: none; 
      border-radius: 12px; 
      cursor: pointer; 
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      min-width: 180px;
    }
    
    .innerhtml-btn { 
      background: linear-gradient(90deg, #4CAF50, #45a049); 
      color: white; 
    }
    .innerhtml-btn:hover { 
      background: linear-gradient(90deg, #f0e404, #f50498); 
      transform: translateY(-3px);
      box-shadow: 0 20px 20px rgba(225, 3, 3, 0.91);
    }
    
    .dom-btn { 
      background: linear-gradient(90deg, #2196F3, #1976D2); 
      color: white; 
    }
    .dom-btn:hover { 
      background: linear-gradient(90deg, #eb1197, #03e5f5); 
      transform: translateY(-3px);
      box-shadow: 0 20px 20px rgba(225, 3, 3, 0.91);
    }
    
    .clear-btn { 
      background: linear-gradient(90deg, #f44336, #d32f2f); 
      color: white; 
    }
    .clear-btn:hover { 
      background: linear-gradient(90deg, #ed0404, #ef4b05); 
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(225, 3, 3, 0.91);
    }
    
    .table-container {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 25px;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
      border: 2px dashed #dee2e6;
      min-height: 400px;
    }
    
    table { 
      width: 100%; 
      border-collapse: collapse; 
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      display: none;
    }
    
    table.show { display: table; }
    
    th { 
      background: linear-gradient(90deg, #495057, #343a40); 
      color: white; 
      padding: 18px 15px; 
      text-align: left; 
      font-weight: 600;
      font-size: 1.05em;
    }
    
    td { 
      padding: 16px 15px; 
      border-bottom: 1px solid #e9ecef;
    }
    
    tr:hover td { 
      background: #e3f2fd; 
      transform: scale(1.01);
    }
    
    .empty-state {
      text-align: center;
      color: #6c757d;
      padding: 60px 20px;
      font-size: 1.3em;
    }
    
    .empty-state i { 
      font-size: 4em; 
      display: block; 
      margin-bottom: 20px; 
      opacity: 0.5;
    }
    
    .method-info {
      background: linear-gradient(135deg, #20e227, #068ceb);
      color: white;
      padding: 15px;
      border-radius: 10px;
      margin-top: 30px;
      text-align: center;
      font-weight: 500;
    }
    
    @media (max-width: 768px) {
      .button-group { flex-direction: column; align-items: center; }
      button { width: 100%; max-width: 300px; }
      .table-container { min-height: 300px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Product Table Comparison - Part 2</h1>
    <p class="subtitle">Click a button to load coffee data using different methods!</p>
    
    <!-- THREE BUTTONS AT TOP -->
    <div class="button-group">
      <button class="innerhtml-btn" onclick="loadInnerHTML()">
        ☕ Load with InnerHTML
      </button>
      <button class="dom-btn" onclick="loadDirectDOM()">
        ☕ Load with Direct DOM
      </button>
      <button class="clear-btn" onclick="clearTable()">
        🗑️ Clear Data
      </button>
    </div>
    
    <!-- SINGLE EMPTY TABLE BELOW BUTTONS -->
    <div class="table-container">
      <table id="coffeeTable">
        <thead>
          <tr>
            <th>Coffee Type</th>
            <th>Price</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
      
      <!-- EMPTY STATE - SHOWS BY DEFAULT -->
      <div class="empty-state" id="emptyState">
        <i>☕</i>
        <div>Table is empty! Click a button above to load coffee types</div>
        <small>Try InnerHTML, Direct DOM, or Clear to see the difference</small>
      </div>
    </div>
    
    <!-- CURRENT METHOD DISPLAY -->
    <div class="method-info" id="methodInfo" style="display: none;">
      Loaded with: <span id="currentMethod"></span>
    </div>
  </div>

  <script>
    // ☕ COFFEE TYPES DATA - ONLY CHANGE FROM PRODUCTS
    const coffees = [
      { name: "Espresso", price: 3.50, category: "Espresso-Based" },
      { name: "Cappuccino", price: 4.75, category: "Espresso-Based" },
      { name: "Latte", price: 5.25, category: "Milk-Based" },
      { name: "Americano", price: 3.00, category: "Espresso-Based" },
      { name: "Flat White", price: 5.00, category: "Milk-Based" },
      { name: "Cold Brew", price: 4.50, category: "Cold" }
    ];

    // 🔥 1. INNERHTML METHOD
    function loadInnerHTML() {
      const tbody = document.getElementById('tableBody');
      let html = '';
      
      coffees.forEach(coffee => {
        html += `<tr>
          <td>${coffee.name}</td>
          <td>$${coffee.price.toFixed(2)}</td>
          <td>${coffee.category}</td>
        </tr>`;
      });
      
      tbody.innerHTML = html;
      showTable();
      updateMethodInfo('☕ InnerHTML ');
    }

    // 🔥 2. DIRECT DOM METHOD
    function loadDirectDOM() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = ''; // Clear first
      
      coffees.forEach(coffee => {
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        const tdPrice = document.createElement('td');
        const tdCategory = document.createElement('td');
        
        tdName.textContent = coffee.name;
        tdPrice.textContent = `$${coffee.price.toFixed(2)}`;
        tdCategory.textContent = coffee.category;
        
        tr.appendChild(tdName);
        tr.appendChild(tdPrice);
        tr.appendChild(tdCategory);
        tbody.appendChild(tr);
      });
      
      showTable();
      updateMethodInfo('☕ Direct DOM ');
    }

    // 🔥 3. CLEAR TABLE
    function clearTable() {
      document.getElementById('tableBody').innerHTML = '';
      hideTable();
      document.getElementById('methodInfo').style.display = 'none';
    }

    // Helper functions
    function showTable() {
      document.getElementById('coffeeTable').classList.add('show');
      document.getElementById('emptyState').style.display = 'none';
    }
    
    function hideTable() {
      document.getElementById('coffeeTable').classList.remove('show');
      document.getElementById('emptyState').style.display = 'block';
    }
    
    function updateMethodInfo(method) {
      document.getElementById('currentMethod').textContent = method;
      document.getElementById('methodInfo').style.display = 'block';
    }
  </script>
</body>
</html>
